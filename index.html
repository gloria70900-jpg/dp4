<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Universal Dome Video Theater</title>
  <style>
    html, body { margin:0; padding:0; background:#000; color:#eee; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; height:100%; overflow:hidden; touch-action:none; }
    #ui { position: fixed; top: 12px; left: 12px; z-index: 100; background: rgba(8, 12, 18, 0.94); backdrop-filter: blur(10px); border:1px solid rgba(80,180,255,0.25); border-radius: 12px; padding: 12px 14px; max-width: 440px; max-height: 92vh; overflow-y: auto; line-height: 1.25; }
    #ui h1 { font-size: 14px; margin: 0 0 6px; font-weight: 700; color:#4da6ff; }
    #ui h2 { font-size: 12px; margin: 10px 0 6px; font-weight: 700; color:#66e6b0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }
    #ui .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
    #ui label { width: 170px; font-size: 11px; color:#ddd; }
    #ui input[type="range"] { flex:1; accent-color: #00aa77; }
    #ui select, #ui button { background:#151e28; color:#eee; border-radius:6px; border:1px solid #335577; padding:6px 8px; font-size:11px; }
    #ui button { cursor:pointer; }
    #ui button:hover { background:#203040; }

    .dome-card { background: rgba(0, 170, 120, 0.12); border: 1px solid #00aa77; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .dome-card h3 { margin: 0 0 6px; font-size: 12px; color: #66e6b0; }
    #domeFileInput { width: 100%; font-size: 12px; color: #fff; background: #08201a; padding: 8px; border: 1px solid #00aa77; border-radius: 6px; box-sizing: border-box; cursor: pointer; }
    #videoStatus { font-size: 11px; color: #88ffcc; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }

    .dichoptic-card { background: rgba(140, 70, 255, 0.14); border: 1px solid #9955ff; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .dichoptic-card h3 { margin: 0 0 8px; font-size: 12px; color: #c499ff; font-weight: 700; }
    .radio-group { display: flex; gap: 12px; margin-bottom: 8px; background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08); }
    .radio-label { display: flex; align-items: center; gap: 6px; font-size: 11px; cursor: pointer; color: #fff; font-weight: 600; width: auto !important; }
    .radio-label input[type="radio"] { accent-color: #9955ff; cursor: pointer; }
    #sharpnessSelect, #tintModeSelect { width: 100%; box-sizing: border-box; font-size: 11px; padding: 6px 8px; font-weight: bold; color: #e8d0ff; background: #1f1430; border: 1px solid #8844ee; border-radius: 6px; margin-bottom: 8px; }

    /* 블러 비율 직접 입력 및 1~10% 버튼 UI */
    .blur-preset-container { display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 6px; border: 1px solid rgba(153,85,255,0.25); margin-bottom: 8px; }
    .blur-btn-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
    .blur-btn { padding: 5px 0; font-size: 11px; font-weight: bold; background: #221535; border: 1px solid #663399; color: #d8b4fe; border-radius: 4px; cursor: pointer; text-align: center; }
    .blur-btn:hover { background: #3c1e63; }
    .blur-btn.active { background: #9955ff; color: #fff; border-color: #c499ff; box-shadow: 0 0 6px rgba(153,85,255,0.8); }
    #blurPercentInput { width: 56px; padding: 4px 6px; background: #1f1430; color: #f3e8ff; border: 1px solid #9955ff; border-radius: 6px; font-size: 12px; font-weight: bold; text-align: center; outline: none; }

    .rec-card { background: rgba(255, 59, 48, 0.12); border: 1px solid #ff3b30; border-radius: 8px; padding: 8px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
    .rec-btn-row { display: flex; gap: 6px; }
    .rec-btn { flex: 1; padding: 9px 5px; font-weight: 700; font-size: 11px; color: #fff; border-radius: 6px; cursor: pointer; }
    #recMonoBtn { background: #992020; border: 1px solid #ff5555; }
    #recSbsBtn { background: #1c528f; border: 1px solid #4a90e2; }
    .recording { animation: recBlink 1.2s infinite alternate; }
    #recMonoBtn.recording { background: #ff2222; }
    #recSbsBtn.recording { background: #0077ff; }
    @keyframes recBlink { 0% { opacity: 1; } 100% { opacity: 0.45; } }
    #recStatus { font-size: 11px; color: #ff9999; text-align: center; margin-top: 2px; }

    .mobile-vr-card { background: rgba(0, 160, 220, 0.15); border: 1px solid #00a0dc; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    #mobileVrBtn { width: 100%; padding: 8px; font-weight: 700; font-size: 11px; background: #0077aa; color: #fff; border: 1px solid #00c8ff; border-radius: 6px; cursor: pointer; }
    
    #exitVrBtn { display: none; position: fixed; top: 12px; right: 12px; z-index: 200; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #666; border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

<button id="exitVrBtn">✕ VR 모드 종료</button>

<div id="ui">
  <h1>Universal 몰입형 돔 극장 (양안 독립 신경조절)</h1>

  <!-- 1. 비디오 선택 -->
  <div class="dome-card">
    <h3>🎬 동영상 로더 (일반 평면 / 와이드 비디오)</h3>
    <input type="file" id="domeFileInput" accept="video/*,.mp4,.webm,.mkv,.avi,.mov" />
    <div id="videoStatus">재생할 비디오 파일을 선택해 주세요.</div>
    <div class="row" style="margin-top:8px;">
      <button id="playPauseBtn" style="flex:1;">▶ 재생 / 일시정지</button>
      <button id="restartBtn" style="flex:1;">⏮ 처음부터</button>
    </div>
    <div class="row">
      <label>동영상 볼륨</label>
      <input id="domeVol" type="range" min="0" max="1" step="0.01" value="0.9" />
    </div>
  </div>

  <!-- 2. 다이코틱 선명도 및 파스텔 틴트 신경조절 제어 -->
  <div class="dichoptic-card">
    <h3>👁️ 다이코틱 양안 선명도 & 신경조절 제어</h3>
    <div style="font-size: 11px; color:#ddd; margin-bottom: 4px;">선명도 강조 눈 선택:</div>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="dominantEye" value="left" id="eyeRadioLeft" />
        <span>🔵 왼쪽 눈(Left) 더 선명하게</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="dominantEye" value="right" id="eyeRadioRight" checked />
        <span>🟢 오른쪽 눈(Right) 더 선명하게</span>
      </label>
    </div>

    <div style="font-size: 11px; color:#ddd; margin-bottom: 4px;">양안 선명도 격차 설정 (6단계):</div>
    <select id="sharpnessSelect">
      <option value="1">1단계: 미세한 선명도 차이 (Gentle)</option>
      <option value="2">2단계: 자연스러운 선명도 차이 (Mild)</option>
      <option value="3" selected>3단계: 표준 권장 선명도 차이 (Standard)</option>
      <option value="4">4단계: 뚜렷한 샤프닝 & 블러 (High)</option>
      <option value="5">5단계: 강력한 초고선명 & 소프트 (Ultra)</option>
      <option value="6">6단계: 극한 선명도 대비 (Extreme Crisp)</option>
    </select>

    <!-- 픽셀 블러 비율 (1% ~ 10%, 디폴트 5%) 버튼 & 직접 입력 -->
    <div class="blur-preset-container">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:11px; color:#ddd; font-weight:bold;">블러 영역 비율 (300×200 그리드):</span>
        <div style="display:flex; align-items:center; gap:3px;">
          <input id="blurPercentInput" type="number" min="1" max="10" step="1" value="5" />
          <span style="font-size:11px; font-weight:bold; color:#c499ff;">%</span>
        </div>
      </div>
      <div class="blur-btn-grid">
        <button class="blur-btn" data-val="1">1%</button>
        <button class="blur-btn" data-val="2">2%</button>
        <button class="blur-btn" data-val="3">3%</button>
        <button class="blur-btn" data-val="4">4%</button>
        <button class="blur-btn active" data-val="5">5%</button>
        <button class="blur-btn" data-val="6">6%</button>
        <button class="blur-btn" data-val="7">7%</button>
        <button class="blur-btn" data-val="8">8%</button>
        <button class="blur-btn" data-val="9">9%</button>
        <button class="blur-btn" data-val="10">10%</button>
      </div>
    </div>

    <!-- 파스텔 틴트 & 랜덤 회색 모드 선택 -->
    <div style="font-size: 11px; color:#ddd; margin-bottom: 4px;">신경동조 블러 픽셀 컬러 테마:</div>
    <select id="tintModeSelect">
      <option value="0">자연스러운 모노크롬 (완전 회색조)</option>
      <option value="1" selected>🌸 파스텔 4색 + 회색 랜덤 교차 순환 (권장)</option>
      <option value="2">💗 소프트 핑크 틴트 + 회색 랜덤</option>
      <option value="3">🌿 소프트 연두 틴트 + 회색 랜덤</option>
      <option value="4">✨ 소프트 노랑 틴트 + 회색 랜덤</option>
      <option value="5">🔮 소프트 보라 틴트 + 회색 랜덤</option>
    </select>

    <div class="row" style="margin-top: 6px;">
      <label id="entrainFreqLabel">신경동조 주파수: 10 Hz (Alpha)</label>
      <input id="entrainFreqSlider" type="range" min="4" max="12" step="1" value="10" style="accent-color: #38bdf8;" />
    </div>
  </div>

  <!-- 3. A/B 녹화 모듈 -->
  <div class="rec-card">
    <div class="rec-btn-row">
      <button id="recMonoBtn" class="rec-btn">🔴 단일 녹화 (A 버튼 / Key A)</button>
      <button id="recSbsBtn" class="rec-btn">🔵 양안 SBS 녹화 (B 버튼 / Key B)</button>
    </div>
    <div id="recStatus">녹화 대기 중 (A: 단일화면 / B: 양안분할화면)</div>
  </div>

  <div class="mobile-vr-card">
    <button id="mobileVrBtn">🥽 스마트폰 수경 VR 모드 켜기</button>
  </div>

  <h2>돔 극장 파라미터 (양안 75° FOV)</h2>
  <div class="row"><label>돔 스크린 반경 (m)</label><input id="domeRadius" type="range" min="10" max="60" step="1" value="25" /></div>
  <div class="row"><label>오른쪽 썸스틱 전후 이동 감도</label><input id="stickSpeed" type="range" min="0.05" max="0.5" step="0.05" value="0.15" /></div>
</div>

<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
  import { VRButton } from 'https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/webxr/VRButton.js';

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // ---------- 1. WebGL 렌더러 & 씬 초기화 ----------
  const renderer = new THREE.WebGLRenderer({ 
    antialias: true, 
    alpha: false, 
    preserveDrawingBuffer: true, 
    powerPreference: 'high-performance' 
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));
  renderer.xr.setFramebufferScaleFactor(1.25);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const FIXED_FOV = 75.0;
  const camera = new THREE.PerspectiveCamera(FIXED_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, 0.0);
  camera.layers.enable(1);

  const camLeft = new THREE.PerspectiveCamera(FIXED_FOV, (window.innerWidth * 0.5) / window.innerHeight, 0.1, 1000);
  camLeft.layers.set(1);

  const camRight = new THREE.PerspectiveCamera(FIXED_FOV, (window.innerWidth * 0.5) / window.innerHeight, 0.1, 1000);
  camRight.layers.set(2);

  const IPD = 0.064;

  const sbsCanvas = document.createElement('canvas');
  sbsCanvas.width = 1920; sbsCanvas.height = 1080;
  const sbsRenderer = new THREE.WebGLRenderer({ 
    canvas: sbsCanvas, 
    antialias: true, 
    preserveDrawingBuffer: true 
  });
  sbsRenderer.setSize(1920, 1080);
  sbsRenderer.autoClear = false;

  const sbsCamLeft = new THREE.PerspectiveCamera(FIXED_FOV, 960 / 1080, 0.1, 1000);
  sbsCamLeft.layers.set(1);

  const sbsCamRight = new THREE.PerspectiveCamera(FIXED_FOV, 960 / 1080, 0.1, 1000);
  sbsCamRight.layers.set(2);

  // ---------- 2. Web Audio 시스템 ----------
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContextClass();
  window.addEventListener('pointerdown', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

  const audioStreamDest = audioCtx.createMediaStreamDestination();
  const masterRecordGain = audioCtx.createGain();
  masterRecordGain.gain.value = 1.0;
  masterRecordGain.connect(audioCtx.destination);
  masterRecordGain.connect(audioStreamDest);

  const domeVideoEl = document.createElement('video');
  domeVideoEl.crossOrigin = 'anonymous';
  domeVideoEl.playsInline = true;
  domeVideoEl.loop = true;
  domeVideoEl.muted = false;
  domeVideoEl.preload = 'auto';

  let domeVideoTex = null;
  let videoSourceNode = null;
  const domeVideoGain = audioCtx.createGain();
  domeVideoGain.gain.value = 0.9;
  domeVideoGain.connect(masterRecordGain);

  // ---------- 3. 돔 스크린 & 파스텔 + 랜덤 회색 셰이더 ----------
  const theaterGroup = new THREE.Group();
  scene.add(theaterGroup);

  let theaterParams = {
    radius: 25.0,
    height: 1.6,
    stickSpeed: 0.15,
    dominantEye: 'right',
    sharpnessLevel: 3,
    blurPercent: 5,       // 디폴트 5%
    tintMode: 1,          // 1: 파스텔 + 랜덤 회색 순환
    entrainFreq: 10.0
  };

  const DICHOPTIC_LEVELS = {
    1: { sharpStrength: 0.6,  sharpContrast: 1.04, sharpBright: 1.00, blurRadius: 1.2, softContrast: 0.92, softBright: 0.90 },
    2: { sharpStrength: 1.1,  sharpContrast: 1.08, sharpBright: 1.00, blurRadius: 2.2, softContrast: 0.86, softBright: 0.85 },
    3: { sharpStrength: 1.8,  sharpContrast: 1.12, sharpBright: 1.00, blurRadius: 3.5, softContrast: 0.80, softBright: 0.80 },
    4: { sharpStrength: 2.6,  sharpContrast: 1.18, sharpBright: 1.00, blurRadius: 5.0, softContrast: 0.72, softBright: 0.74 },
    5: { sharpStrength: 3.5,  sharpContrast: 1.24, sharpBright: 1.00, blurRadius: 7.0, softContrast: 0.65, softBright: 0.68 },
    6: { sharpStrength: 4.8,  sharpContrast: 1.32, sharpBright: 1.00, blurRadius: 9.5, softContrast: 0.55, softBright: 0.60 }
  };

  const waitCanvas = document.createElement('canvas');
  waitCanvas.width = 1920; waitCanvas.height = 1080;
  const wCtx = waitCanvas.getContext('2d');
  wCtx.fillStyle = '#050a12';
  wCtx.fillRect(0, 0, 1920, 1080);
  wCtx.fillStyle = '#3a7ca5';
  wCtx.font = 'bold 40px sans-serif';
  wCtx.textAlign = 'center';
  wCtx.fillText('비디오 파일을 선택하면 몰입형 돔 영상이 시작됩니다', 960, 540);

  const defaultTex = new THREE.CanvasTexture(waitCanvas);
  defaultTex.minFilter = THREE.LinearFilter;
  defaultTex.magFilter = THREE.LinearFilter;
  defaultTex.generateMipmaps = false;
  defaultTex.wrapS = THREE.ClampToEdgeWrapping;
  defaultTex.wrapT = THREE.ClampToEdgeWrapping;

  const dichopticVertexShader = `
    varying vec2 vUv;
    void main() {
      vUv = vec2(1.0 - uv.x, uv.y);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  // 300x200 그리드 + 부드러운 파스텔 4색 + 불규칙적(랜덤) 회색 결합 셰이더
  const dichopticFragmentShader = `
    uniform sampler2D uMap;
    uniform vec2 uTexelSize;
    uniform float uMode;         // 1.0 = 우세안, 0.0 = 비우세안
    uniform float uSharpness;
    uniform float uBlurRadius;
    uniform float uContrast;
    uniform float uBrightness;
    uniform float uBlurThreshold;// 1% ~ 10% (0.01 ~ 0.10)
    uniform vec2 uGridResolution;// vec2(300.0, 200.0)
    uniform float uTime;
    uniform float uEntrainFreq;
    uniform int uTintMode;       // 0:순수회색, 1:순환+랜덤회색, 2~5:단색+랜덤회색
    varying vec2 vUv;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    vec3 getPastelTint(float t, vec2 cellId) {
      vec3 colPink   = vec3(1.00, 0.86, 0.90); // 연분홍
      vec3 colMint   = vec3(0.88, 0.98, 0.90); // 연두
      vec3 colYellow = vec3(1.00, 0.98, 0.84); // 연노랑
      vec3 colViolet = vec3(0.92, 0.88, 1.00); // 연보라

      if (uTintMode == 0) return vec3(1.0);
      if (uTintMode == 2) return colPink;
      if (uTintMode == 3) return colMint;
      if (uTintMode == 4) return colYellow;
      if (uTintMode == 5) return colViolet;

      // uTintMode == 1 (순환 주기: 약 20초)
      float progress = mod(t * 0.20 + (cellId.x + cellId.y) * 0.012, 4.0);
      if (progress < 1.0) {
        return mix(colPink, colMint, fract(progress));
      } else if (progress < 2.0) {
        return mix(colMint, colYellow, fract(progress));
      } else if (progress < 3.0) {
        return mix(colYellow, colViolet, fract(progress));
      } else {
        return mix(colViolet, colPink, fract(progress));
      }
    }

    void main() {
      if (uMode > 0.5) {
        // [우세안]: Unsharp Masking 엣지 샤프닝
        vec2 step = uTexelSize * 1.25;
        vec3 center = texture2D(uMap, vUv).rgb;
        vec3 n = texture2D(uMap, vUv + vec2(0.0, step.y)).rgb;
        vec3 s = texture2D(uMap, vUv - vec2(0.0, step.y)).rgb;
        vec3 e = texture2D(uMap, vUv + vec2(step.x, 0.0)).rgb;
        vec3 w = texture2D(uMap, vUv - vec2(step.x, 0.0)).rgb;
        vec3 avg = (n + s + e + w) * 0.25;
        vec3 edge = center - avg;
        vec3 finalColor = center + edge * uSharpness;

        finalColor = (finalColor - 0.5) * uContrast + 0.5;
        finalColor *= uBrightness;
        gl_FragColor = vec4(clamp(finalColor, 0.0, 1.0), 1.0);

      } else {
        // [비우세안]: 신경조절 셔플링 + 무작위 회색/파스텔 결합
        float stepTime = floor(uTime * uEntrainFreq);
        vec2 cellId = floor(vUv * uGridResolution);
        
        // 블러 영역 선택용 난수
        float rnd = hash21(cellId + vec2(stepTime * 0.173, stepTime * 0.317));

        // 특정 순서 없이 회색이 랜덤하게 끼어들도록 하는 독립 난수
        float grayRnd = hash21(cellId + vec2(stepTime * 0.651, stepTime * 0.887));

        float phase = uTime * uEntrainFreq * 6.2831853;
        vec2 motionOffset = vec2(sin(phase + cellId.y), cos(phase + cellId.x)) * uTexelSize * 1.5;

        // 진동 펄스 ±18%
        float pulse = 1.0 + 0.18 * sin(phase);
        float tileJitter = 1.0 + (hash21(cellId + vec2(stepTime * 0.431, stepTime * 0.729)) - 0.5) * 0.30;

        vec3 finalColor;

        if (rnd < uBlurThreshold) {
          // [선택된 블러 타일]: 9-Tap 가우시안 블러
          vec2 targetUv = vUv + motionOffset;
          vec2 step = uTexelSize * uBlurRadius;
          vec3 center = texture2D(uMap, targetUv).rgb;

          vec3 c0 = center * 0.25;
          vec3 c1 = texture2D(uMap, targetUv + vec2( step.x,  0.0)).rgb * 0.125;
          vec3 c2 = texture2D(uMap, targetUv + vec2(-step.x,  0.0)).rgb * 0.125;
          vec3 c3 = texture2D(uMap, targetUv + vec2( 0.0,  step.y)).rgb * 0.125;
          vec3 c4 = texture2D(uMap, targetUv + vec2( 0.0, -step.y)).rgb * 0.125;
          vec3 c5 = texture2D(uMap, targetUv + vec2( step.x,  step.y)).rgb * 0.0625;
          vec3 c6 = texture2D(uMap, targetUv + vec2(-step.x,  step.y)).rgb * 0.0625;
          vec3 c7 = texture2D(uMap, targetUv + vec2( step.x, -step.y)).rgb * 0.0625;
          vec3 c8 = texture2D(uMap, targetUv + vec2(-step.x, -step.y)).rgb * 0.0625;
          finalColor = c0 + c1 + c2 + c3 + c4 + c5 + c6 + c7 + c8;

          // 명암 대비 및 펄스 변조
          float combinedMod = pulse * tileJitter;
          finalColor = (finalColor - 0.5) * (uContrast * combinedMod) + 0.5;
          finalColor *= (uBrightness * combinedMod);

          // 회색 vs 파스텔 틴트 동적 혼합
          // 약 40% 확률로 순수 회색(tint 0.0), 60% 확률로 은은한 파스텔 틴트(tint 0.14)
          if (uTintMode > 0) {
            float tintAmount = (grayRnd < 0.40) ? 0.0 : 0.14;
            vec3 pastel = getPastelTint(uTime, cellId);
            finalColor = mix(finalColor, finalColor * pastel * 1.05, tintAmount);
          }
        } else {
          // 비선택 영역: 원본 100%
          finalColor = texture2D(uMap, vUv).rgb;
        }

        gl_FragColor = vec4(clamp(finalColor, 0.0, 1.0), 1.0);
      }
    }
  `;

  function createEyeMaterial() {
    return new THREE.ShaderMaterial({
      uniforms: {
        uMap: { value: defaultTex },
        uTexelSize: { value: new THREE.Vector2(1.0 / 1920.0, 1.0 / 1080.0) },
        uMode: { value: 1.0 },
        uSharpness: { value: 1.8 },
        uBlurRadius: { value: 3.5 },
        uContrast: { value: 1.12 },
        uBrightness: { value: 1.0 },
        uBlurThreshold: { value: 0.05 }, // 5% 기본
        uGridResolution: { value: new THREE.Vector2(300.0, 200.0) },
        uTime: { value: 0.0 },
        uEntrainFreq: { value: 10.0 },
        uTintMode: { value: 1 } // 파스텔+회색 랜덤 순환 기본
      },
      vertexShader: dichopticVertexShader,
      fragmentShader: dichopticFragmentShader,
      side: THREE.BackSide,
      depthTest: true,
      depthWrite: true
    });
  }

  const leftEyeMat = createEyeMaterial();
  const rightEyeMat = createEyeMaterial();

  let leftDomeMesh = null;
  let rightDomeMesh = null;

  function buildFullDomeScreen() {
    if (leftDomeMesh) {
      theaterGroup.remove(leftDomeMesh);
      leftDomeMesh.geometry.dispose();
    }
    if (rightDomeMesh) {
      theaterGroup.remove(rightDomeMesh);
      rightDomeMesh.geometry.dispose();
    }

    const r = theaterParams.radius;
    const geoLeft = new THREE.SphereGeometry(r, 64, 48);
    const geoRight = new THREE.SphereGeometry(r, 64, 48);

    leftDomeMesh = new THREE.Mesh(geoLeft, leftEyeMat);
    leftDomeMesh.position.set(0, theaterParams.height, 0);
    leftDomeMesh.rotation.y = Math.PI * 0.5;
    leftDomeMesh.layers.set(1);

    rightDomeMesh = new THREE.Mesh(geoRight, rightEyeMat);
    rightDomeMesh.position.set(0, theaterParams.height, 0);
    rightDomeMesh.rotation.y = Math.PI * 0.5;
    rightDomeMesh.layers.set(2);

    theaterGroup.add(leftDomeMesh);
    theaterGroup.add(rightDomeMesh);

    updateDichopticMaterials();
  }

  function updateDichopticMaterials() {
    const cfg = DICHOPTIC_LEVELS[theaterParams.sharpnessLevel] || DICHOPTIC_LEVELS[3];
    const leftIsDominant = (theaterParams.dominantEye === 'left');
    const blurThresh = theaterParams.blurPercent / 100.0;
    const freq = theaterParams.entrainFreq;
    const tint = theaterParams.tintMode;

    // 좌안 유니폼
    leftEyeMat.uniforms.uMode.value = leftIsDominant ? 1.0 : 0.0;
    leftEyeMat.uniforms.uSharpness.value = cfg.sharpStrength;
    leftEyeMat.uniforms.uBlurRadius.value = cfg.blurRadius;
    leftEyeMat.uniforms.uContrast.value = leftIsDominant ? cfg.sharpContrast : cfg.softContrast;
    leftEyeMat.uniforms.uBrightness.value = leftIsDominant ? cfg.sharpBright : cfg.softBright;
    leftEyeMat.uniforms.uBlurThreshold.value = blurThresh;
    leftEyeMat.uniforms.uEntrainFreq.value = freq;
    leftEyeMat.uniforms.uTintMode.value = tint;

    // 우안 유니폼
    rightEyeMat.uniforms.uMode.value = leftIsDominant ? 0.0 : 1.0;
    rightEyeMat.uniforms.uSharpness.value = cfg.sharpStrength;
    rightEyeMat.uniforms.uBlurRadius.value = cfg.blurRadius;
    rightEyeMat.uniforms.uContrast.value = leftIsDominant ? cfg.softContrast : cfg.sharpContrast;
    rightEyeMat.uniforms.uBrightness.value = leftIsDominant ? cfg.softBright : cfg.sharpBright;
    rightEyeMat.uniforms.uBlurThreshold.value = blurThresh;
    rightEyeMat.uniforms.uEntrainFreq.value = freq;
    rightEyeMat.uniforms.uTintMode.value = tint;

    camera.layers.disableAll();
    camera.layers.enable(leftIsDominant ? 1 : 2);
  }

  buildFullDomeScreen();

  // ---------- 4. 비디오 파일 로드 ----------
  const domeFileInput = $('#domeFileInput');
  const videoStatus = $('#videoStatus');
  const playPauseBtn = $('#playPauseBtn');
  const restartBtn = $('#restartBtn');
  const domeVol = $('#domeVol');

  let isVideoLoopActive = false;
  function videoFrameCallback() {
    if (domeVideoTex) domeVideoTex.needsUpdate = true;
    if ('requestVideoFrameCallback' in domeVideoEl) {
      domeVideoEl.requestVideoFrameCallback(videoFrameCallback);
    }
  }

  domeFileInput.addEventListener('change', () => {
    const file = domeFileInput.files && domeFileInput.files[0];
    if (!file) return;

    if (audioCtx.state === 'suspended') audioCtx.resume();
    videoStatus.textContent = `⏳ 파일 스트림 로딩 중: ${file.name}...`;

    const streamUrl = URL.createObjectURL(file);
    domeVideoEl.src = streamUrl;
    domeVideoEl.load();

    if (domeVideoTex) domeVideoTex.dispose();
    domeVideoTex = new THREE.VideoTexture(domeVideoEl);
    domeVideoTex.minFilter = THREE.LinearFilter;
    domeVideoTex.magFilter = THREE.LinearFilter;
    domeVideoTex.generateMipmaps = false;
    domeVideoTex.wrapS = THREE.ClampToEdgeWrapping;
    domeVideoTex.wrapT = THREE.ClampToEdgeWrapping;

    leftEyeMat.uniforms.uMap.value = domeVideoTex;
    rightEyeMat.uniforms.uMap.value = domeVideoTex;

    if (!videoSourceNode) {
      try {
        videoSourceNode = audioCtx.createMediaElementSource(domeVideoEl);
        videoSourceNode.connect(domeVideoGain);
      } catch(err) {
        console.warn('Audio node skipped:', err);
      }
    }

    domeVideoEl.onloadedmetadata = () => {
      const vw = domeVideoEl.videoWidth || 1920;
      const vh = domeVideoEl.videoHeight || 1080;
      leftEyeMat.uniforms.uTexelSize.value.set(1.0 / vw, 1.0 / vh);
      rightEyeMat.uniforms.uTexelSize.value.set(1.0 / vw, 1.0 / vh);
    };

    domeVideoEl.onloadeddata = () => {
      domeVideoEl.play().then(() => {
        videoStatus.textContent = `▶ 돔 극장 재생 중: ${file.name}`;
        if (!isVideoLoopActive && 'requestVideoFrameCallback' in domeVideoEl) {
          isVideoLoopActive = true;
          domeVideoEl.requestVideoFrameCallback(videoFrameCallback);
        }
      }).catch(() => {
        videoStatus.textContent = `준비 완료: [▶ 재생] 버튼을 눌러주세요.`;
      });
    };

    domeVideoEl.onerror = () => {
      videoStatus.textContent = `❌ 재생 오류: 지원되는 비디오 코덱(MP4 H.264 권장)인지 확인해 주세요.`;
    };
  });

  playPauseBtn.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!domeVideoEl.src) return;
    if (domeVideoEl.paused) {
      domeVideoEl.play().then(() => {
        videoStatus.textContent = `▶ 재생 중`;
      }).catch(() => {
        videoStatus.textContent = `재생 실패: 화면 터치 필요`;
      });
    } else {
      domeVideoEl.pause();
      videoStatus.textContent = `⏸ 일시 정지됨`;
    }
  });

  restartBtn.addEventListener('click', () => {
    if (!domeVideoEl.src) return;
    domeVideoEl.currentTime = 0;
    domeVideoEl.play();
  });

  domeVol.addEventListener('input', e => {
    domeVideoGain.gain.value = Number(e.target.value);
  });

  // ---------- 5. UI 이벤트 제어 ----------
  const eyeRadioLeft = $('#eyeRadioLeft');
  const eyeRadioRight = $('#eyeRadioRight');
  const sharpnessSelect = $('#sharpnessSelect');
  const tintModeSelect = $('#tintModeSelect');
  const blurPercentInput = $('#blurPercentInput');
  const blurBtns = $$('.blur-btn');
  const entrainFreqSlider = $('#entrainFreqSlider');
  const entrainFreqLabel = $('#entrainFreqLabel');
  const domeRadiusEl = $('#domeRadius');
  const stickSpeedEl = $('#stickSpeed');

  function handleEyeSelectionChange() {
    theaterParams.dominantEye = eyeRadioLeft.checked ? 'left' : 'right';
    updateDichopticMaterials();
  }

  eyeRadioLeft.addEventListener('change', handleEyeSelectionChange);
  eyeRadioRight.addEventListener('change', handleEyeSelectionChange);

  sharpnessSelect.addEventListener('change', (e) => {
    theaterParams.sharpnessLevel = parseInt(e.target.value, 10);
    updateDichopticMaterials();
  });

  tintModeSelect.addEventListener('change', (e) => {
    theaterParams.tintMode = parseInt(e.target.value, 10);
    updateDichopticMaterials();
  });

  // 블러 비율 적용 헬퍼
  function applyBlurPercent(val) {
    theaterParams.blurPercent = val;
    blurPercentInput.value = val;
    blurBtns.forEach(btn => {
      if (parseInt(btn.dataset.val, 10) === val) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    updateDichopticMaterials();
  }

  // 1% ~ 10% 원클릭 버튼 리스너
  blurBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const val = parseInt(btn.dataset.val, 10);
      applyBlurPercent(val);
    });
  });

  // 숫자 직접 입력: 타이핑 도중 리셋 방지 및 완료 시(blur/change) 범위 확정
  blurPercentInput.addEventListener('input', (e) => {
    const raw = e.target.value;
    if (raw === '') return;
    let val = parseInt(raw, 10);
    if (!isNaN(val) && val >= 1 && val <= 10) {
      applyBlurPercent(val);
    }
  });

  blurPercentInput.addEventListener('blur', () => {
    let val = parseInt(blurPercentInput.value, 10);
    if (isNaN(val) || val < 1) val = 1;
    if (val > 10) val = 10;
    applyBlurPercent(val);
  });

  entrainFreqSlider.addEventListener('input', (e) => {
    theaterParams.entrainFreq = parseFloat(e.target.value);
    const bandName = theaterParams.entrainFreq <= 7 ? 'Theta' : 'Alpha';
    entrainFreqLabel.textContent = `신경동조 주파수: ${theaterParams.entrainFreq} Hz (${bandName})`;
    updateDichopticMaterials();
  });

  domeRadiusEl.addEventListener('input', e => {
    theaterParams.radius = Number(e.target.value);
    buildFullDomeScreen();
  });

  stickSpeedEl.addEventListener('input', e => {
    theaterParams.stickSpeed = Number(e.target.value);
  });

  // ---------- 6. 스마트폰 수경 VR (Cardboard SBS) ----------
  const uiPanel = $('#ui');
  const exitVrBtn = $('#exitVrBtn');
  const mobileVrBtn = $('#mobileVrBtn');
  let isMobileVr = false;
  let deviceEuler = new THREE.Euler(0, 0, 0, 'YXZ');

  function startMobileVR(){
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
      }).catch(console.error);
    } else {
      window.addEventListener('deviceorientation', handleOrientation);
    }

    const docEl = document.documentElement;
    if (docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});
    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();

    isMobileVr = true;
    uiPanel.style.display = 'none';
    exitVrBtn.style.display = 'block';
    onResize();
  }

  function stopMobileVR(){
    isMobileVr = false;
    uiPanel.style.display = 'block';
    exitVrBtn.style.display = 'none';
    window.removeEventListener('deviceorientation', handleOrientation);
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    onResize();
  }

  mobileVrBtn.addEventListener('click', startMobileVR);
  exitVrBtn.addEventListener('click', stopMobileVR);

  function handleOrientation(e){
    if (!e.alpha) return;
    const alpha = THREE.MathUtils.degToRad(e.alpha);
    const beta = THREE.MathUtils.degToRad(e.beta);
    const gamma = THREE.MathUtils.degToRad(e.gamma);
    deviceEuler.set(beta, alpha, -gamma, 'YXZ');
    camera.quaternion.setFromEuler(deviceEuler);
  }

  function onResize(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.fov = FIXED_FOV;
    camera.updateProjectionMatrix();

    camLeft.aspect = (w * 0.5) / h;
    camLeft.fov = FIXED_FOV;
    camLeft.updateProjectionMatrix();

    camRight.aspect = (w * 0.5) / h;
    camRight.fov = FIXED_FOV;
    camRight.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);

  // ---------- 7. 녹화 모듈 ----------
  const recMonoBtn = $('#recMonoBtn');
  const recSbsBtn  = $('#recSbsBtn');
  const recStatus  = $('#recStatus');

  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let recordingMode = null;

  function getBestSupportedMimeType(){
    const candidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=h264', 'video/webm'];
    for(const t of candidates){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    }
    return '';
  }

  function startRecording(mode){
    if (isRecording) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    try {
      recordingMode = mode;
      const streamSource = (mode === 'sbs') ? sbsCanvas.captureStream(30) : renderer.domElement.captureStream(30);

      const audioTracks = audioStreamDest.stream.getAudioTracks();
      const tracks = [...streamSource.getVideoTracks()];
      if (audioTracks.length > 0) tracks.push(audioTracks[0]);
      const combinedStream = new MediaStream(tracks);

      const mime = getBestSupportedMimeType();
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(combinedStream, mime ? { mimeType: mime, videoBitsPerSecond: 12000000 } : {});

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const isMp4 = mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
        const prefix = (recordingMode === 'sbs') ? 'Dome_SBS' : 'Dome_Mono';
        a.download = `${prefix}_${dateStr}.${ext}`;
        a.href = url;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);

        recStatus.textContent = `저장 완료: ${prefix}_${dateStr}.${ext}`;
        recMonoBtn.classList.remove('recording');
        recSbsBtn.classList.remove('recording');
        recMonoBtn.textContent = '🔴 단일 녹화 (A 버튼 / Key A)';
        recSbsBtn.textContent = '🔵 양안 SBS 녹화 (B 버튼 / Key B)';
        isRecording = false;
        recordingMode = null;
      };

      mediaRecorder.start(1000);
      isRecording = true;

      if (mode === 'sbs') {
        recSbsBtn.classList.add('recording');
        recSbsBtn.textContent = '⏹️ SBS 녹화 중지 (B 버튼)';
        recStatus.textContent = '● [양안 SBS] 녹화 진행 중...';
      } else {
        recMonoBtn.classList.add('recording');
        recMonoBtn.textContent = '⏹️ 단일 녹화 중지 (A 버튼)';
        recStatus.textContent = '● [단일 모노] 녹화 진행 중...';
      }

    } catch (err) {
      recStatus.textContent = '녹화 실패: ' + err.message;
      isRecording = false;
    }
  }

  function stopRecording(){
    if (!isRecording || !mediaRecorder) return;
    if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    recStatus.textContent = '인코딩 및 MP4 저장 중...';
  }

  function toggleRecordMono(){
    if (isRecording) {
      if (recordingMode === 'mono') stopRecording();
      else { stopRecording(); setTimeout(()=>startRecording('mono'), 400); }
    } else {
      startRecording('mono');
    }
  }

  function toggleRecordSbs(){
    if (isRecording) {
      if (recordingMode === 'sbs') stopRecording();
      else { stopRecording(); setTimeout(()=>startRecording('sbs'), 400); }
    } else {
      startRecording('sbs');
    }
  }

  recMonoBtn.addEventListener('click', toggleRecordMono);
  recSbsBtn.addEventListener('click', toggleRecordSbs);

  window.addEventListener('keydown', (e)=>{
    if (e.code === 'KeyA') toggleRecordMono();
    if (e.code === 'KeyB') toggleRecordSbs();
  });

  // ---------- 8. Quest 2 컨트롤러 제어 ----------
  let lastButtonStates = { btnA: false, btnB: false };

  function handleXRControllers(){
    const session = renderer.xr.getSession();
    if (!session || !session.inputSources) return;

    for (const source of session.inputSources) {
      if (!source || !source.gamepad) continue;
      const gp = source.gamepad;

      if (source.handedness === 'right') {
        if (gp.buttons) {
          const bA = gp.buttons[4];
          const bB = gp.buttons[5];

          if (bA) {
            const pressedA = bA.pressed || bA.value > 0.5;
            if (pressedA && !lastButtonStates.btnA) toggleRecordMono();
            lastButtonStates.btnA = pressedA;
          }
          if (bB) {
            const pressedB = bB.pressed || bB.value > 0.5;
            if (pressedB && !lastButtonStates.btnB) toggleRecordSbs();
            lastButtonStates.btnB = pressedB;
          }
        }

        if (gp.axes && gp.axes.length >= 4) {
          const stickY = gp.axes[3];
          const deadZone = 0.12;
          if (Math.abs(stickY) > deadZone) {
            theaterGroup.position.z += stickY * theaterParams.stickSpeed;
            theaterGroup.position.z = THREE.MathUtils.clamp(theaterGroup.position.z, -40.0, 15.0);
          }
        }
      }
    }
  }

  renderer.xr.addEventListener('sessionstart', () => {
    uiPanel.style.display = 'none';
  });

  renderer.xr.addEventListener('sessionend', () => {
    uiPanel.style.display = 'block';
  });

  // ---------- 9. 메인 렌더 루프 ----------
  const clock = new THREE.Clock();

  renderer.setAnimationLoop(() => {
    const elapsedTime = clock.getElapsedTime();

    leftEyeMat.uniforms.uTime.value = elapsedTime;
    rightEyeMat.uniforms.uTime.value = elapsedTime;

    if (domeVideoTex && domeVideoEl.readyState >= domeVideoEl.HAVE_CURRENT_DATA) {
      domeVideoTex.needsUpdate = true;
    }

    if (renderer.xr.isPresenting) {
      const xrCam = renderer.xr.getCamera();
      if (xrCam && xrCam.cameras && xrCam.cameras.length >= 2) {
        xrCam.cameras[0].layers.set(1);
        xrCam.cameras[1].layers.set(2);
      }
    }

    if (isRecording && recordingMode === 'sbs') {
      const refCam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
      sbsCamLeft.position.copy(refCam.position);
      sbsCamRight.position.copy(refCam.position);
      sbsCamLeft.quaternion.copy(refCam.quaternion);
      sbsCamRight.quaternion.copy(refCam.quaternion);
      sbsCamLeft.translateX(-IPD * 0.5);
      sbsCamRight.translateX(IPD * 0.5);

      sbsCamLeft.fov = FIXED_FOV;
      sbsCamRight.fov = FIXED_FOV;
      sbsCamLeft.updateProjectionMatrix();
      sbsCamRight.updateProjectionMatrix();

      sbsRenderer.setScissorTest(false);
      sbsRenderer.clear();

      // 좌안
      sbsRenderer.setViewport(0, 0, 960, 1080);
      sbsRenderer.setScissor(0, 0, 960, 1080);
      sbsRenderer.setScissorTest(true);
      sbsRenderer.render(scene, sbsCamLeft);

      // 우안
      sbsRenderer.setViewport(960, 0, 960, 1080);
      sbsRenderer.setScissor(960, 0, 960, 1080);
      sbsRenderer.setScissorTest(true);
      sbsRenderer.render(scene, sbsCamRight);

      sbsRenderer.setScissorTest(false);
    }

    if (renderer.xr.isPresenting) {
      handleXRControllers();
      renderer.render(scene, camera);

    } else if (isMobileVr) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const halfW = Math.floor(w * 0.5);

      renderer.setScissorTest(false);
      renderer.autoClear = false;
      renderer.clear();

      camLeft.position.copy(camera.position);
      camRight.position.copy(camera.position);
      camLeft.quaternion.copy(camera.quaternion);
      camRight.quaternion.copy(camera.quaternion);
      camLeft.translateX(-IPD * 0.5);
      camRight.translateX(IPD * 0.5);

      camLeft.fov = FIXED_FOV;
      camRight.fov = FIXED_FOV;
      camLeft.updateProjectionMatrix();
      camRight.updateProjectionMatrix();

      // 좌안
      renderer.setViewport(0, 0, halfW, h);
      renderer.setScissor(0, 0, halfW, h);
      renderer.setScissorTest(true);
      renderer.render(scene, camLeft);

      // 우안
      renderer.setViewport(halfW, 0, halfW, h);
      renderer.setScissor(halfW, 0, halfW, h);
      renderer.setScissorTest(true);
      renderer.render(scene, camRight);

      renderer.setScissorTest(false);

    } else {
      renderer.autoClear = true;
      renderer.render(scene, camera);
    }
  });
</script>
</body>
